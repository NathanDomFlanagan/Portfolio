    <meta name="robots" content="noindex" />

    <!-- GitHub Pages serves this file for ANY unmatched path, so every URL here
         is root-relative. Relative ones would resolve against the bogus path
         (/Portfolio/a/b/) and 404 in turn, leaving an unstyled page. -->
    <link rel="icon" type="image/png" href="/Portfolio/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=DM+Serif+Display&amp;family=Outfit:wght@300;400;500&amp;display=swap"
    />
    <link rel="stylesheet" href="/Portfolio/styles.css" />
    <script>
      try {
        var s = localStorage.getItem("theme");
        if (s) document.documentElement.setAttribute("data-theme", s);
      } catch (e) {
        /* fall back to prefers-color-scheme */
      }
    </script>
  </head>

              <span class="card-name">Back to home</span>
            </div>
            <span class="card-arrow">→</span>
          </a>
