<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — Nathan Flanagan</title>
    <link rel="stylesheet" href="styles.css" />
    <script>
      (function () {
        var saved = localStorage.getItem("theme");
        if (saved) document.documentElement.setAttribute("data-theme", saved);
      })();
    </script>
  </head>
  <body>
    <nav class="navbar">
      <a class="nav-brand" href="index.html">Nathan.</a>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="game.html">Games</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
      <div class="nav-right">
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">◐</button>
        <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">&#9776;</button>
      </div>
    </nav>

    <div class="page-header">
      <h1>Get in <span class="accent">Touch</span></h1>
    </div>

    <div class="content">
      <section>
        <h2>Contact Details</h2>
        <div class="contact-grid">
          <a class="contact-card" href="mailto:jaypedesh7@gmail.com">
            <span class="contact-label">Email</span>
            <span class="contact-value">jaypedesh7@gmail.com</span>
          </a>
          <a class="contact-card" href="https://github.com/NathanDomFlanagan" target="_blank" rel="noopener noreferrer">
            <span class="contact-label">GitHub</span>
            <span class="contact-value">NathanDomFlanagan</span>
          </a>
          <a class="contact-card" href="https://www.linkedin.com/in/nathan-flanagan-ab9139248/" target="_blank" rel="noopener noreferrer">
            <span class="contact-label">LinkedIn</span>
            <span class="contact-value">nathan-flanagan-ab9139248</span>
          </a>
        </div>
      </section>
    </div>

    <footer><p>Nathan Flanagan &nbsp;·&nbsp; Auckland, NZ</p></footer>

    <script>
      document.getElementById("nav-toggle").addEventListener("click", function () {
        document.getElementById("nav-links").classList.toggle("open");
      });
      var root = document.documentElement;
      var btn  = document.getElementById("theme-toggle");
      function getTheme() {
        if (root.hasAttribute("data-theme")) return root.getAttribute("data-theme");
        return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      function applyTheme(theme) {
        root.setAttribute("data-theme", theme);
        localStorage.setItem("theme", theme);
        btn.textContent = theme === "dark" ? "◑" : "◐";
      }
      applyTheme(getTheme());
      btn.addEventListener("click", function () {
        applyTheme(getTheme() === "dark" ? "light" : "dark");
      });
    </script>
  </body>
</html>
