    <script>
      // Runs before first paint so the saved theme doesn't flash. localStorage
      // throws wherever site data is blocked, and an uncaught throw here would
      // leave the page stuck on whatever the media query picked.
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          if (saved) document.documentElement.setAttribute("data-theme", saved);
        } catch (e) {
          /* fall back to prefers-color-scheme */
        }
      })();
    </script>
